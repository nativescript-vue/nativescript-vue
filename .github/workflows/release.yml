name: Release

# Stages nativescript-vue and @nativescript-vue/template-blank on npm with
# provenance when a v* tag is pushed, or when dispatched for an existing tag.
# Create the tag with `npm run release`. Nothing goes live from CI: a
# maintainer approves each staged version with 2FA (`npm stage approve`),
# which is what publishes it.
#
# Each package is staged in its own job, and a version that is already
# staged counts as success, so a partial failure can be re-run for the
# package that failed.
#
# Requires, once, outside this file:
# - npm Trusted Publishing for both packages, pointing at this repository,
#   this workflow file and the `npm` environment, with only the
#   "stage publish" permission. No npm token is stored anywhere.
# - The `npm` environment in the repository settings.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to stage, e.g. v3.1.0
        required: true
        type: string

permissions: {}

env:
  SKIP_SIMPLE_GIT_HOOKS: 1
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check tag matches package versions
        run: node scripts/check-release-version.mjs "$TAG"

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  stage:
    name: Stage ${{ matrix.package.name }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: nativescript-vue
            directory: .
          - name: '@nativescript-vue/template-blank'
            directory: packages/template-blank
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ matrix.package.name }}?activeTab=versions
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build
        if: matrix.package.directory == '.'
        run: npm run build

      - name: Stage on npm
        working-directory: ${{ matrix.package.directory }}
        run: |
          if [[ "$TAG" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi

          set +e
          output=$(npm stage publish --provenance --access public --tag "$dist_tag" 2>&1)
          status=$?
          set -e
          echo "$output"

          if [[ $status -ne 0 ]]; then
            if grep -q 'Cannot stage previously published version' <<< "$output"; then
              echo "::notice::${{ matrix.package.name }}@${TAG#v} is already staged"
              exit 0
            fi
            exit $status
          fi

  release:
    name: Draft GitHub release
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      # Draft until the staged versions are approved, so the GitHub release
      # never points at a version that is not installable yet.
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists"
            exit 0
          fi
          args=(--draft --generate-notes --verify-tag)
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"

      - name: Next steps
        run: |
          version="${TAG#v}"
          if [[ "$TAG" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          {
            echo "## Staged, not published"
            echo
            echo "Both packages are staged on npm as \`$version\` with dist-tag \`$dist_tag\`."
            echo "To publish, approve each with 2FA from a machine where you are logged in to npm:"
            echo
            echo '```sh'
            echo "npm stage list nativescript-vue"
            echo "npm stage approve <stage-id>"
            echo "npm stage list @nativescript-vue/template-blank"
            echo "npm stage approve <stage-id>"
            echo '```'
            echo
            echo "Then publish the draft GitHub release for \`$TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"
